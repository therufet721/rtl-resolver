name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:workspaces
      - run: npm run lint
      - run: npm run build
      - run: npm run build:workspaces
      - run: npm test
      - run: npm run check:exports
      - run: npm run lint:rtl
      - name: Dirty and CSS-in-JS fixtures must fail lint
        run: |
          if node packages/cli/dist/cli.js lint test/fixtures/lint/dirty; then
            echo "expected dirty CSS fixtures to fail lint" >&2
            exit 1
          fi
          if node packages/cli/dist/cli.js lint test/fixtures/lint/css-in-js; then
            echo "expected CSS-in-JS fixtures to fail lint" >&2
            exit 1
          fi

  browsers:
    name: Chromium / Firefox / WebKit
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@rtl-resolver/browser
      - run: npx playwright install --with-deps
      - run: npm run test:browsers

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    needs: verify
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:workspaces
      - run: npm ci
        working-directory: examples/storybook
      - run: npm run build
        working-directory: examples/storybook

  conformance:
    name: Unicode conformance
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:bidi:conformance

  voiceover:
    name: VoiceOver
    runs-on: macos-latest
    needs: verify
    env:
      RTL_AT: voiceover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:workspaces
      - uses: guidepup/setup-action@0.21.0
      - run: npx playwright install webkit
      - run: npm run test:at:voiceover

  nvda:
    name: NVDA
    runs-on: windows-latest
    needs: verify
    env:
      RTL_AT: nvda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:workspaces
      - uses: guidepup/setup-action@0.21.0
      - run: npx playwright install firefox
      - run: npm run test:at:nvda

  package-size:
    name: Package size budget
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:workspaces
      - run: npm run check:size
      - run: npm run check:exports
